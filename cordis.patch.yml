- insert:
    - id: agentswitch-team-service
      name: '@deepseek-ai/dsh-experimental-agent-team'
      config:
        maxMembers: 8
    - id: agentswitch-team-ui
      name: '@deepseek-ai/dsh-experimental-client-ui-agent-team'
    - id: agentswitch-runtime
      name: cordis:group
      group: true
      isolate:
        workflowEngine: true
      config:
        - id: agentswitch-workflow
          name: '@deepseek-ai/dsh-workflow-ptc'
          config:
            provider: spawn
        - id: agentswitch
          name: dsh-enhancement-switches
          config:
            maxRounds: 8
